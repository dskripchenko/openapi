%YAML 1.2
---
# A petstore-like OpenAPI 3.0 spec exercising the YAML features specs use.
openapi: 3.0.3
info:
  title: Swagger Petstore
  version: 1.0.0
  description: |
    A sample API that uses a petstore as an example.

    Supports **markdown**:
      - indented lines stay as they are
  termsOfService: http://swagger.io/terms/
  contact: {name: API Team, email: apiteam@example.com, url: 'http://swagger.io'}
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://petstore.example.com/v1
  description: >-
    Production server, folded
    onto one line
- url: "http://localhost:{port}/v1"
  variables:
    port:
      default: '8080'
      enum: ['8080', "9090"]
tags: [pets, store]
paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      parameters:
        - &limitParam
          name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
            maximum: 100
            default: 20
      responses:
        '200':
          description: A paged array of pets
          headers:
            x-next:
              description: A link to the next page of responses
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pets'
        default: &errorResponse
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a pet
      operationId: createPets
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Pet'}
      responses:
        201:
          description: Null response
        default: *errorResponse
  /pets/{petId}:
    get:
      summary: Info for a specific pet
      parameters:
        - name: petId
          in: path
          required: true
          description: The id of the pet to retrieve
          schema:
            type: string
        - *limitParam
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        default: *errorResponse
components:
  schemas:
    Base: &base
      type: object
      required: [id, name]
    Pet:
      <<: *base
      properties:
        id: {type: integer, format: int64}
        name:
          type: string
          example: "Fido \u00e9"
        tag:
          type: string
          nullable: true
          pattern: '^[a-z]+$'   # a comment after a value
        weight: {type: number, minimum: 0.5, exclusiveMaximum: 1e3}
        enabled: {type: boolean, default: True}
        empty: ~
    Pets:
      type: array
      maxItems: 0x64
      items:
        $ref: '#/components/schemas/Pet'
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
...
